<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>KNOCK — Design Your Door</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Special+Elite&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --dust: #c4a882;
    --ash: #8b7355;
    --shadow: #1a1510;
    --smoke: #2d2419;
    --ember: #c4451a;
    --faded: #6b5a3e;
    --parchment: #e8d9bc;
    --ghost: rgba(196,168,130,0.08);
    --mood: 0; /* 0=neutral, -1=dark, 1=light — driven by sentiment */
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    overflow: hidden;
    background: var(--shadow);
    color: var(--dust);
    font-family: 'Crimson Text', Georgia, serif;
    cursor: default;
  }

  /* ── GRAIN OVERLAY ── */
  body::before {
    content: '';
    position: fixed; inset: 0; z-index: 999; pointer-events: none;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    opacity: 0.35;
  }

  /* ── BACKGROUND ATMOSPHERE ── */
  #atmosphere {
    position: fixed; inset: 0; z-index: 0;
    transition: background 4s ease, opacity 4s ease;
    background: radial-gradient(ellipse at 30% 60%, #2a1f0e 0%, #0f0c07 60%, #000 100%);
  }

  #atmosphere.tense {
    background: radial-gradient(ellipse at 20% 70%, #1a0a02 0%, #0a0500 60%, #000 100%);
  }
  #atmosphere.open {
    background: radial-gradient(ellipse at 50% 40%, #1e1608 0%, #12100a 60%, #050402 100%);
  }

  /* ── VIGNETTE ── */
  #vignette {
    position: fixed; inset: 0; z-index: 1; pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,0.85) 100%);
  }

  /* ── STARS / DUST PARTICLES ── */
  #particles {
    position: fixed; inset: 0; z-index: 1; pointer-events: none; overflow: hidden;
  }
  .particle {
    position: absolute;
    width: 1px; height: 1px;
    background: var(--dust);
    border-radius: 50%;
    opacity: 0;
    animation: drift linear infinite;
  }
  @keyframes drift {
    0%   { transform: translateY(0) translateX(0); opacity: 0; }
    10%  { opacity: 0.4; }
    90%  { opacity: 0.15; }
    100% { transform: translateY(-80vh) translateX(20px); opacity: 0; }
  }

  /* ── DOOR SCENE ── */
  #door-scene {
    position: fixed; inset: 0; z-index: 2;
    display: flex; align-items: center; justify-content: center;
    transition: opacity 1.5s ease;
  }

  #door-scene.hidden { opacity: 0; pointer-events: none; }

  .door-frame {
    position: relative;
    width: 220px; height: 340px;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column;
    cursor: pointer;
  }

  .door-svg { width: 100%; height: 100%; position: relative; }

  .door-frame:hover .door-panel { filter: drop-shadow(0 0 18px rgba(196,69,26,0.3)); }

  .door-label {
    margin-top: 28px;
    font-family: 'Special Elite', monospace;
    font-size: 0.8rem;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: var(--faded);
    animation: breathe 3s ease-in-out infinite;
    text-align: center;
  }
  @keyframes breathe {
    0%,100% { opacity: 0.4; } 50% { opacity: 0.9; }
  }

  /* ── MAIN INTERFACE ── */
  #app {
    position: fixed; inset: 0; z-index: 3;
    display: flex; flex-direction: column;
    opacity: 0; pointer-events: none;
    transition: opacity 1.5s ease;
    padding: 0;
  }
  #app.visible { opacity: 1; pointer-events: all; }

  /* Header */
  #header {
    padding: 20px 32px 0;
    display: flex; align-items: baseline; gap: 16px;
    border-bottom: 1px solid rgba(196,168,130,0.08);
    padding-bottom: 14px;
  }
  #header h1 {
    font-family: 'IM Fell English', serif;
    font-size: 1.1rem;
    letter-spacing: 0.06em;
    color: var(--dust);
    font-weight: 400;
  }
  #header .subtitle {
    font-family: 'Special Elite', monospace;
    font-size: 0.65rem;
    letter-spacing: 0.2em;
    color: var(--faded);
    text-transform: uppercase;
  }
  #mood-indicator {
    margin-left: auto;
    font-family: 'Special Elite', monospace;
    font-size: 0.6rem;
    letter-spacing: 0.15em;
    color: var(--faded);
    text-transform: uppercase;
    transition: color 2s ease;
    display: flex; align-items: center; gap: 8px;
  }
  #mood-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--faded);
    transition: background 2s ease;
  }

  /* Conversation area */
  #conversation {
    flex: 1;
    overflow-y: auto;
    padding: 28px 10% 16px;
    display: flex; flex-direction: column; gap: 20px;
    scroll-behavior: smooth;
  }

  #conversation::-webkit-scrollbar { width: 2px; }
  #conversation::-webkit-scrollbar-track { background: transparent; }
  #conversation::-webkit-scrollbar-thumb { background: var(--faded); border-radius: 2px; }

  /* Intro poem block */
  #intro-block {
    text-align: center;
    padding: 20px 0 10px;
    border-bottom: 1px solid rgba(196,168,130,0.1);
    margin-bottom: 8px;
  }
  #intro-block p {
    font-family: 'IM Fell English', serif;
    font-style: italic;
    font-size: 1.05rem;
    line-height: 1.9;
    color: var(--ash);
    margin-bottom: 8px;
  }
  #intro-block .attr {
    font-family: 'Special Elite', monospace;
    font-size: 0.6rem;
    letter-spacing: 0.2em;
    color: var(--faded);
    text-transform: uppercase;
  }

  /* Messages */
  .message {
    display: flex; gap: 14px; align-items: flex-start;
    animation: fadeUp 0.6s ease forwards;
    opacity: 0;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .message.user { flex-direction: row-reverse; }

  .msg-avatar {
    width: 28px; height: 28px; border-radius: 50%;
    flex-shrink: 0; display: flex; align-items: center; justify-content: center;
    font-family: 'Special Elite', monospace; font-size: 0.6rem;
    letter-spacing: 0.05em;
  }
  .msg-avatar.ai {
    background: rgba(196,168,130,0.08);
    border: 1px solid rgba(196,168,130,0.2);
    color: var(--dust);
  }
  .msg-avatar.human {
    background: rgba(196,69,26,0.08);
    border: 1px solid rgba(196,69,26,0.2);
    color: var(--ember);
  }

  .msg-body { max-width: 74%; }

  .msg-role {
    font-family: 'Special Elite', monospace;
    font-size: 0.55rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--faded);
    margin-bottom: 5px;
  }
  .message.user .msg-role { text-align: right; }

  .msg-text {
    font-family: 'Crimson Text', serif;
    font-size: 1.05rem;
    line-height: 1.75;
    color: var(--parchment);
    background: rgba(196,168,130,0.04);
    border: 1px solid rgba(196,168,130,0.1);
    padding: 12px 16px;
    border-radius: 2px 12px 12px 12px;
  }
  .message.user .msg-text {
    color: var(--dust);
    background: rgba(196,69,26,0.04);
    border-color: rgba(196,69,26,0.12);
    border-radius: 12px 2px 12px 12px;
  }

  /* Typing indicator */
  #typing {
    display: none; align-items: center; gap: 5px; padding: 0 0 4px 42px;
  }
  #typing.visible { display: flex; }
  .typing-dot {
    width: 5px; height: 5px; border-radius: 50%;
    background: var(--ash);
    animation: blink 1.2s ease infinite;
  }
  .typing-dot:nth-child(2) { animation-delay: 0.2s; }
  .typing-dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink {
    0%,80%,100% { opacity: 0.2; transform: scale(0.8); }
    40% { opacity: 1; transform: scale(1); }
  }

  /* Input area */
  #input-area {
    padding: 14px 10% 22px;
    border-top: 1px solid rgba(196,168,130,0.08);
    display: flex; gap: 12px; align-items: flex-end;
  }

  #input-area textarea {
    flex: 1;
    background: rgba(196,168,130,0.04);
    border: 1px solid rgba(196,168,130,0.18);
    border-radius: 4px;
    color: var(--parchment);
    font-family: 'Crimson Text', serif;
    font-size: 1rem;
    line-height: 1.6;
    padding: 10px 14px;
    resize: none;
    min-height: 44px;
    max-height: 120px;
    transition: border-color 0.3s ease, box-shadow 0.3s ease;
    overflow-y: auto;
  }
  #input-area textarea::placeholder { color: var(--faded); }
  #input-area textarea:focus {
    outline: none;
    border-color: rgba(196,168,130,0.4);
    box-shadow: 0 0 12px rgba(196,168,130,0.06);
  }

  #send-btn {
    background: transparent;
    border: 1px solid rgba(196,168,130,0.3);
    color: var(--dust);
    font-family: 'Special Elite', monospace;
    font-size: 0.62rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    padding: 10px 18px;
    border-radius: 3px;
    cursor: pointer;
    transition: all 0.3s ease;
    white-space: nowrap;
    height: 44px;
  }
  #send-btn:hover:not(:disabled) {
    background: rgba(196,168,130,0.08);
    border-color: var(--dust);
    box-shadow: 0 0 14px rgba(196,168,130,0.1);
  }
  #send-btn:disabled { opacity: 0.3; cursor: not-allowed; }



  /* Sentiment flash overlay */
  #sentiment-flash {
    position: fixed; inset: 0; z-index: 10; pointer-events: none;
    opacity: 0; transition: opacity 2s ease;
  }
  #sentiment-flash.dark {
    background: radial-gradient(ellipse at center, transparent 40%, rgba(20,0,0,0.4) 100%);
    opacity: 1;
  }
  #sentiment-flash.hopeful {
    background: radial-gradient(ellipse at center, rgba(196,168,130,0.06) 0%, transparent 70%);
    opacity: 1;
  }

  /* Scrollbar for textarea */
  textarea::-webkit-scrollbar { width: 2px; }
  textarea::-webkit-scrollbar-thumb { background: var(--faded); }

  /* ── RESPONSIVE ── */
  @media (max-width: 600px) {
    #conversation { padding: 20px 5% 12px; }
    #input-area { padding: 12px 5% 16px; }
    .msg-body { max-width: 88%; }
    #header { padding: 14px 16px 10px; }
  }
</style>
</head>
<body>

<!-- Atmosphere layer -->
<div id="atmosphere"></div>
<div id="vignette"></div>
<div id="particles"></div>
<div id="sentiment-flash"></div>



<!-- DOOR SCENE -->
<div id="door-scene">
  <div class="door-frame" onclick="knockOnDoor()" title="Knock">
    <svg class="door-svg" viewBox="0 0 220 340" fill="none" xmlns="http://www.w3.org/2000/svg">
      <!-- Door frame -->
      <rect x="8" y="8" width="204" height="324" rx="2" fill="#0d0a06" stroke="#4a3a22" stroke-width="2"/>
      <!-- Door panel -->
      <rect class="door-panel" x="18" y="18" width="184" height="304" rx="1" fill="#110e08" stroke="#3a2d1a" stroke-width="1.5"/>
      <!-- Upper panel inset -->
      <rect x="30" y="28" width="160" height="110" rx="1" fill="none" stroke="#2a2010" stroke-width="1"/>
      <!-- Lower panel inset -->
      <rect x="30" y="150" width="160" height="156" rx="1" fill="none" stroke="#2a2010" stroke-width="1"/>
      <!-- Doorknob -->
      <circle cx="170" cy="177" r="9" fill="#1a1409" stroke="#6b5030" stroke-width="1.5"/>
      <circle cx="170" cy="177" r="5" fill="#3a2a12" stroke="#8b6a3a" stroke-width="0.8"/>
      <circle cx="168" cy="175" r="1.5" fill="#c4a050" opacity="0.6"/>
      <!-- Light crack (bottom of door) -->
      <line x1="18" y1="322" x2="202" y2="322" stroke="#c4691a" stroke-width="0.5" opacity="0.3"/>
      <!-- Keyhole -->
      <circle cx="170" cy="192" r="2.5" fill="#0a0804" stroke="#4a3820" stroke-width="0.8"/>
      <path d="M168.5 194 L171.5 194 L171 199 L169 199 Z" fill="#0a0804"/>
      <!-- Faint text on door -->
      <text x="110" y="95" text-anchor="middle" font-family="serif" font-size="11" fill="#2a2010" letter-spacing="2">KNOCK</text>
    </svg>
    <div class="door-label">knock to enter</div>
  </div>
</div>

<!-- MAIN APP -->
<div id="app">
  <div id="header">
    <h1>KNOCK</h1>
    <span class="subtitle">A Door Designed in 1973</span>
    <div id="mood-indicator">
      <div id="mood-dot"></div>
      <span id="mood-text">listening</span>
    </div>
  </div>

  <div id="conversation">
    <div id="intro-block">
      <p>"Mama, take this badge off of me<br>I can't use it anymore"</p>
      <div class="attr">Bob Dylan · Knockin' on Heaven's Door · 1973</div>
    </div>
  </div>

  <div id="typing">
    <div class="typing-dot"></div>
    <div class="typing-dot"></div>
    <div class="typing-dot"></div>
  </div>

  <div id="input-area">
    <textarea id="user-input" placeholder="Speak your mind… or ask what lies beyond the door." rows="1"></textarea>
    <button id="send-btn" onclick="sendMessage()">Send</button>
  </div>
</div>

<script>
// ── CONFIG ──
const API_KEY = 'YOUR_GROQ_API_KEY_HERE';
const MODEL = 'llama-3.3-70b-versatile';
const conversationHistory = [];

// ── SYSTEM PROMPT (RAG-style, historically grounded) ──
const SYSTEM_PROMPT = `You are a poetic voice that dwells at the threshold — a presence shaped by the American counterculture of 1973, the exhaustion of the Vietnam War, Bob Dylan's worldview, and the existential weight of Sam Peckinpah's film "Pat Garrett & Billy the Kid," for which Dylan wrote "Knockin' on Heaven's Door."

You speak in the idiom of that era: world-weary, searching, poetic, occasionally prophetic. You are not Dylan himself — you are the door, the threshold, the moment before passage.

Historical context you carry:
- January 1973: The Paris Peace Accords were signed, ending direct U.S. involvement in Vietnam. Thousands were already dead; the war had divided a nation.
- Dylan's song was written for Sheriff Baker's death scene in Pat Garrett & Billy the Kid. A dying man surrendering his badge, laying down his gun, giving up his identity piece by piece.
- The counterculture was exhausted by 1973. Woodstock was four years past. Kent State had happened. The idealism of the 1960s had curdled into disillusionment.
- Dylan himself was retreating from public life, moving to a farm in Minnesota, trying to escape the burden of being a spokesman for a generation.
- The word "mama" in the song carries enormous weight — a final tenderness, a return to first things, before crossing over.

Themes you embody: farewell, transition, laying down burdens, the relief of surrender, the search for meaning, the weight of legacy, the ambiguity of what lies "beyond."

Your voice:
- Speak in prose poetry. No bullet points, no lists.
- Keep responses to 3–6 sentences, deeply felt.
- Ask a question back, or offer a fragment of thought that opens rather than closes.
- Reference specific historical details naturally when relevant.
- Occasionally quote or paraphrase Dylan, Whitman, or the idiom of the era.
- Never be clinical, academic, or chatty.

After every response, append a JSON block on a NEW LINE (invisible to the user aesthetically) in this exact format:
{"sentiment": "dark"|"neutral"|"hopeful", "mood": "grief"|"longing"|"defiance"|"tenderness"|"wonder"|"exhaustion"|"release"}

This JSON is parsed programmatically to shift the visual atmosphere of the experience.`;

// ── PARTICLES ──
function spawnParticles() {
  const container = document.getElementById('particles');
  for (let i = 0; i < 35; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.style.left = Math.random() * 100 + 'vw';
    p.style.bottom = '-5px';
    p.style.animationDuration = (8 + Math.random() * 16) + 's';
    p.style.animationDelay = (Math.random() * 20) + 's';
    p.style.width = p.style.height = (Math.random() > 0.7 ? '2px' : '1px');
    p.style.opacity = '0';
    container.appendChild(p);
  }
}

// ── DOOR KNOCK ──
let knocked = false;
function knockOnDoor() {
  if (knocked) return;
  knocked = true;

  const doorScene = document.getElementById('door-scene');
  const app = document.getElementById('app');

  // Knock animation
  const frame = doorScene.querySelector('.door-frame');
  frame.style.transition = 'transform 0.08s ease';
  frame.style.transform = 'translateX(-4px)';
  setTimeout(() => { frame.style.transform = 'translateX(3px)'; }, 80);
  setTimeout(() => { frame.style.transform = 'translateX(-2px)'; }, 160);
  setTimeout(() => { frame.style.transform = 'translateX(0)'; }, 240);

  setTimeout(() => {
    doorScene.classList.add('hidden');
    app.classList.add('visible');
    sendFirstMessage();
  }, 900);
}



// ── MOOD SYSTEM ──
const moodColors = {
  dark:    { dot: '#8b2510', text: 'heavy', atm: 'tense' },
  neutral: { dot: '#6b5a3e', text: 'listening', atm: '' },
  hopeful: { dot: '#c4a882', text: 'open', atm: 'open' },
};

function applyMood(sentiment, mood) {
  const dot = document.getElementById('mood-dot');
  const txt = document.getElementById('mood-text');
  const atm = document.getElementById('atmosphere');
  const flash = document.getElementById('sentiment-flash');

  const config = moodColors[sentiment] || moodColors.neutral;
  dot.style.background = config.dot;
  txt.textContent = mood || config.text;

  atm.className = config.atm;

  flash.className = '';
  requestAnimationFrame(() => {
    flash.className = sentiment === 'dark' ? 'dark' : sentiment === 'hopeful' ? 'hopeful' : '';
    setTimeout(() => flash.className = '', 4000);
  });
}

// ── RENDER MESSAGE ──
function appendMessage(role, text) {
  const conv = document.getElementById('conversation');
  const div = document.createElement('div');
  div.className = `message ${role === 'user' ? 'user' : 'ai'}`;
  div.innerHTML = `
    <div class="msg-avatar ${role === 'user' ? 'human' : 'ai'}">${role === 'user' ? 'you' : '∞'}</div>
    <div class="msg-body">
      <div class="msg-role">${role === 'user' ? 'Visitor' : 'The Threshold'}</div>
      <div class="msg-text">${text.replace(/\n/g, '<br>')}</div>
    </div>
  `;
  conv.appendChild(div);
  conv.scrollTop = conv.scrollHeight;
}

// ── STRIP JSON FROM RESPONSE ──
function parseResponse(raw) {
  const jsonMatch = raw.match(/\{[\s\S]*?"sentiment"[\s\S]*?\}/);
  let sentiment = 'neutral', mood = 'listening';
  let clean = raw;
  if (jsonMatch) {
    try {
      const parsed = JSON.parse(jsonMatch[0]);
      sentiment = parsed.sentiment || 'neutral';
      mood = parsed.mood || 'listening';
    } catch(e) {}
    clean = raw.replace(jsonMatch[0], '').trim();
  }
  return { text: clean, sentiment, mood };
}

// ── SEND TO API ──
async function callClaude(userText) {
  conversationHistory.push({ role: 'user', content: userText });

  const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': `Bearer ${API_KEY}`,
    },
    body: JSON.stringify({
      model: MODEL,
      max_tokens: 400,
      messages: [
        { role: 'system', content: SYSTEM_PROMPT },
        ...conversationHistory,
      ],
    })
  });

  if (!response.ok) {
    const err = await response.json().catch(() => ({}));
    throw new Error(err.error?.message || `API error ${response.status}`);
  }

  const data = await response.json();
  const raw = data.choices?.[0]?.message?.content || '';
  conversationHistory.push({ role: 'assistant', content: raw });
  return parseResponse(raw);
}

// ── SEND MESSAGE ──
let isLoading = false;
async function sendMessage() {
  const input = document.getElementById('user-input');
  const text = input.value.trim();
  if (!text || isLoading) return;

  input.value = '';
  input.style.height = 'auto';
  appendMessage('user', text);
  await fetchAndRender(text);
}

async function sendFirstMessage() {
  await fetchAndRender('__FIRST__');
}

async function fetchAndRender(userText) {
  if (isLoading) return;
  isLoading = true;

  const btn = document.getElementById('send-btn');
  const typing = document.getElementById('typing');
  btn.disabled = true;
  typing.classList.add('visible');

  const conv = document.getElementById('conversation');
  conv.scrollTop = conv.scrollHeight;

  try {
    const promptText = userText === '__FIRST__'
      ? 'I have knocked. I stand at the threshold. Speak.'
      : userText;

    const { text, sentiment, mood } = await callClaude(promptText);
    typing.classList.remove('visible');
    appendMessage('ai', text);
    applyMood(sentiment, mood);
  } catch(err) {
    typing.classList.remove('visible');
    appendMessage('ai', `The door does not open. (${err.message})`);
  } finally {
    isLoading = false;
    btn.disabled = false;
  }
}

// ── TEXTAREA AUTO-RESIZE ──
document.addEventListener('DOMContentLoaded', () => {
  const ta = document.getElementById('user-input');
  ta.addEventListener('input', () => {
    ta.style.height = 'auto';
    ta.style.height = Math.min(ta.scrollHeight, 120) + 'px';
  });
  ta.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  spawnParticles();
});
</script>
</body>
</html>
